<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=adaptive-1" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=adaptive-1" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <script src="/boot-theme.js"></script>
    <title>Bookaria Studio</title>
    <style>
      .app-boot {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: var(--bg-surface, #fff);
        color: var(--text-muted, #60646c);
        font: 14px/22px "Inter", "Segoe UI", sans-serif;
        text-align: center;
      }
      html.dark { background: #1c1c1c; color-scheme: dark; --bg-surface: #1c1c1c; --text-muted: #9c9c9c; }
      .app-boot-brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .app-boot img { display: block; height: auto; }
      .app-boot .boki-boot-dark { display: none; }
      html.dark .app-boot .boki-boot-light { display: none; }
      html.dark .app-boot .boki-boot-dark { display: block; }
      .app-boot p { margin: 0; max-width: 448px; text-wrap: balance; }
      .app-boot .editor-label { display: none; }
      html[data-editor="true"] .app-boot .app-label { display: none; }
      html[data-editor="true"] .app-boot .editor-label { display: inline; }
      .app-boot-copy { display: flex; flex-direction: column; align-items: center; }
      #app-entry-loading { position: fixed; inset: 0; z-index: 50; overflow-y: auto; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="main" class="app-boot" role="status" aria-busy="true">
        <div class="app-boot-brand" aria-hidden="true">
          <picture class="boki-boot-light">
            <source media="(prefers-reduced-motion: reduce)" srcset="/brand/mascot/light-loading-poster.svg">
            <img loading="lazy" src="/brand/mascot/light-loading-loop.svg" alt="" width="80" height="80">
          </picture>
          <picture class="boki-boot-dark">
            <source media="(prefers-reduced-motion: reduce)" srcset="/brand/mascot/dark-loading-poster.svg">
            <img loading="lazy" src="/brand/mascot/dark-loading-loop.svg" alt="" width="80" height="80">
          </picture>
        </div>
        <div class="app-boot-copy"><p><span class="app-label">Đang tải tài nguyên…</span><span class="editor-label">Đang mở editor…</span></p></div>
      </main>
    </div>
    <noscript>
      <style>#root > .app-boot { display: none; }</style>
      <p>Bạn cần bật JavaScript để sử dụng Bookaria.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
